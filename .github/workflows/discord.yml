name: Teste Discord Webhook

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  discord-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Enviar notificação simples
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          content: "Opa! O GitHub Actions acabou de rodar no repositório: ${{ github.repository }}"
          title: "Deploy/Push Detectado"